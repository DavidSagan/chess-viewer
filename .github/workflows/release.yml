# Builds the viewer and publishes it as a GitHub Release when a version tag is pushed.
# Start a release with tools/release.sh.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: viewer/build.sh "${GITHUB_REF_NAME#v}"

      - name: Zip the app
        run: |
          cd viewer
          ditto -c -k --norsrc --noextattr --noacl --keepParent \
            "Chess PDF Viewer.app" Chess-PDF-Viewer-macOS.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" viewer/Chess-PDF-Viewer-macOS.zip \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
